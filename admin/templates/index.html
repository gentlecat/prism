<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="/static/style.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
            integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous"></script>
    <script>
        const theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', theme);
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            document.documentElement.setAttribute('data-bs-theme', e.matches ? 'dark' : 'light');
        });
    </script>

</head>

<body>

    <nav class="navbar fixed-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Prism</span>
        </div>
    </nav>

    <div class="main-container">
        <div id="error" class="alert alert-danger" role="alert" hidden></div>

        <div class="mb-3">
            <div class="section-title">Allowed connections</div>
            <div id="allowedList"
                 hx-get="/allowed"
                 hx-trigger="load, every 10s, refreshList from:body">
                <div class="empty-state">Loading...</div>
            </div>
        </div>

        <div class="mb-3">
            <div class="section-title">Pending connections</div>
            <div id="pendingList"
                 hx-get="/pending"
                 hx-trigger="load, every 10s, refreshList from:body">
                <div class="empty-state">Loading...</div>
            </div>
        </div>

        <div class="footer-info">
            The lists refresh every 10 seconds<span id="updatedAt"></span>.
        </div>
    </div>

    <script>
        const errorBox = document.getElementById('error');

        function showError(message) {
            errorBox.textContent = message;
            errorBox.hidden = false;
        }

        // Requests that fail would otherwise leave the page unchanged without saying why
        document.body.addEventListener('htmx:responseError', (event) => {
            const text = event.detail.xhr.responseText.trim();
            showError(text ? `Request failed: ${text}` : `Request failed with status ${event.detail.xhr.status}`);
        });
        document.body.addEventListener('htmx:sendError', () => {
            showError('Could not reach Prism. The lists will try again in 10 seconds.');
        });
        document.body.addEventListener('htmx:afterRequest', (event) => {
            if (!event.detail.successful) {
                return;
            }
            errorBox.hidden = true;
            if (event.detail.target.id === 'allowedList' || event.detail.target.id === 'pendingList') {
                const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
                document.getElementById('updatedAt').textContent = `, last updated at ${time}`;
            }
        });
    </script>

</body>

</html>
