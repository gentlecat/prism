name: Publish image

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  build-image:
    runs-on: docker
    container:
      image: node:24-bookworm
      # Mount the dind socket on the container at the default location
      options: -v /dind:/dind

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker
        run: curl -fsSL https://get.docker.com | sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate with Codeberg
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: codeberg.org
          username: r1
          password: ${{ secrets.CODEBERG_TOKEN }}

      - name: Authenticate with local registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.FORGEJO_DOMAIN }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.ACCESS_TOKEN }}

      # On pull requests this builds but does not push (dry run).
      - name: Build and push to both registries
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name != 'pull_request' }}
          context: "{{defaultContext}}"
          platforms: linux/amd64,linux/arm64
          tags: |
            codeberg.org/r1/prism:latest
            ${{ vars.FORGEJO_DOMAIN }}/${{ github.repository_owner }}/prism:latest
