name: Publish image

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: amd64
          - platform: linux/arm64
            arch: arm64
            runner: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to local registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.FORGEJO_DOMAIN }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Log in to Codeberg
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: codeberg.org
          username: r1
          password: ${{ secrets.CODEBERG_TOKEN }}

      # Builds on the runner's native architecture (no emulation).
      # On pull requests this builds but does not push (dry run).
      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ vars.FORGEJO_DOMAIN }}/${{ github.repository_owner }}/prism:${{ matrix.arch }}
            codeberg.org/r1/prism:${{ matrix.arch }}

  # Combine the per-arch images into a single multi-arch :latest manifest.
  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: amd64
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to local registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.FORGEJO_DOMAIN }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Log in to Codeberg
        uses: docker/login-action@v4
        with:
          registry: codeberg.org
          username: r1
          password: ${{ secrets.CODEBERG_TOKEN }}

      - name: Create multi-arch manifests
        shell: bash
        run: |
          img="${{ vars.FORGEJO_DOMAIN }}/${{ github.repository_owner }}/prism"
          docker buildx imagetools create -t "$img:latest" -t "$img:build-$(date -u +%Y%m%d-%H%M%S)" "$img:amd64" "$img:arm64"
          img="codeberg.org/r1/prism"
          docker buildx imagetools create -t "$img:latest" "$img:amd64" "$img:arm64"
